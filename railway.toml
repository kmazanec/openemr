# Railway deploy configuration for the OpenEMR service.
#
# We deploy by running the upstream `openemr/openemr:flex` image directly:
# the container clones the OpenEMR source from GitLab at startup using
# the FLEX_REPOSITORY env vars. There is no Dockerfile and no Railway
# build step — the image is pulled from Docker Hub and configured
# entirely through service environment variables.
#
# Project-shape concerns (creating environments, provisioning MySQL,
# allocating volumes, setting env vars including FLEX_REPOSITORY,
# generating domains) live in infra/bootstrap-env.sh because they
# cannot be expressed in this per-service config.

[deploy]
# OpenEMR's container exposes a readiness endpoint that returns 200
# once Apache is up, the database connection works, and the schema is
# loaded.
healthcheckPath = "/meta/health/readyz"
# First boot is slow because flex clones the repo, runs composer
# install, and runs npm build at runtime. Subsequent restarts are
# faster because deps are cached on the volume.
healthcheckTimeout = 600

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Declares that this service requires a volume mounted at the OpenEMR
# sites/ directory. Railway will refuse to deploy until a volume is
# attached at this path. The volume itself is created by
# infra/bootstrap-env.sh; this field expresses the contract.
#
# sites/ holds:
#   - sites/default/sqlconf.php (written by auto-setup on first boot)
#   - sites/default/documents/  (patient documents at runtime)
# Both must persist across deploys.
requiredMountPath = "/var/www/localhost/htdocs/openemr/sites"
