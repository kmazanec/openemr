# Apache configuration for running OpenEMR behind Railway's edge proxy.
#
# Railway terminates TLS at the edge with a real certificate and forwards
# plain HTTP to the container. The edge sets X-Forwarded-Proto: https on
# every forwarded request. This config makes Apache aware of that fact so
# OpenEMR generates https:// URLs and sets the Secure flag on cookies.
#
# This file lives at /etc/apache2/conf.d/zz-railway.conf in the deploy
# image. The "zz-" prefix ensures it loads after upstream's own configs.

# ---------------------------------------------------------------------------
# Add an IPv6 listener for port 80
# ---------------------------------------------------------------------------
# The upstream flex Dockerfile runs:
#     sed -i 's/^Listen 80$/Listen 0.0.0.0:80/' /etc/apache2/httpd.conf
# which binds Apache to port 80 on IPv4 all-interfaces only. Railway's
# internal service-to-service routing uses IPv6, so the edge proxy hits
# `[::]:80`, gets connection refused, and returns 502 to public clients
# even though the container is healthy on IPv4.
#
# Adding `Listen [::]:80` binds the IPv6 wildcard alongside the existing
# IPv4 binding. Apache stacks Listen directives that differ in address;
# no conflict.
#
# (We cannot use `Listen 80` alone — which historically means "all
# interfaces, both stacks" — because the upstream sed already converted
# that to the IPv4-only form, and a second `Listen 80` collides with it.)
Listen [::]:80

# Note on HTTPProtocolOptions:
#   The upstream openemr.conf sets `HTTPProtocolOptions Strict` at the
#   server scope. Apache 2.4 rejects a second `HTTPProtocolOptions`
#   directive that conflicts with the first ("'Strict' and 'Unsafe'
#   are mutually exclusive"), so we cannot relax this from a conf.d
#   drop-in. If a strictness conflict with Railway's edge ever turns
#   out to be a real cause of 5xx errors, the fix is a sed in this
#   image's Dockerfile to override openemr.conf at build time, not a
#   parallel directive here.

# ---------------------------------------------------------------------------
# Real client IP via X-Forwarded-For
# ---------------------------------------------------------------------------
LoadModule remoteip_module modules/mod_remoteip.so

# Use the X-Forwarded-For header set by Railway's edge to determine the
# real client IP. Apache logs and any code that reads REMOTE_ADDR will
# see the actual client, not the Railway proxy.
RemoteIPHeader X-Forwarded-For

# Only honor X-Forwarded-* headers from these address ranges. Railway's
# internal infrastructure uses 100.0.0.0/8 (carrier-grade NAT range)
# for edge → container traffic, plus the standard private RFC1918
# ranges. Trusting only these ranges prevents header spoofing from
# the public internet — even though Railway's edge always rewrites
# the header, defense in depth is cheap here.
RemoteIPInternalProxy 100.0.0.0/8
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16

# ---------------------------------------------------------------------------
# Trust X-Forwarded-Proto so OpenEMR knows the request was originally HTTPS
# ---------------------------------------------------------------------------
# Apache's HTTPS environment variable is normally only set when the
# connection itself uses SSL. Behind a TLS-terminating proxy, the
# connection is plain HTTP but the original request was HTTPS. We map
# X-Forwarded-Proto: https → HTTPS=on so PHP code that checks
# $_SERVER['HTTPS'] gets the correct value.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
