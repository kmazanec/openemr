# DigitalOcean deploy stack for OpenEMR.
#
# Four services on a single Droplet:
#   - mysql:    MariaDB, internal network only.
#   - redis:    PHP session store + general-purpose cache. Internal
#               network only. Set REDIS_SERVER on the openemr service
#               and the flex entrypoint configures PHP to use Redis as
#               its session handler — sessions then survive
#               --force-recreate openemr (otherwise PHP file sessions
#               in /tmp get wiped, logging users out on every deploy).
#   - agent-postgres: Postgres 16 backing the LangGraph checkpointer
#               for the Clinical Co-Pilot agent service. Internal-only,
#               no host port. Schema migrations are applied by the agent
#               at boot via PostgresSaver.setup() — no init scripts here.
#   - agent:    Clinical Co-Pilot agent service. Built from /agent in
#               the deploy tree. Internal-only — the OpenEMR proxy at
#               /interface/modules/custom_modules/oe-module-clinical-copilot/
#               public/agent.php is the only intended caller. Verifies
#               every request's bearer JWT against OpenEMR's public
#               JWKS (OPENEMR_JWKS_URL → http://openemr/oauth2/default/jwk).
#   - openemr:  Upstream openemr/openemr:flex image. Source code is
#               bind-mounted READ-ONLY from /srv/openemr/current — a
#               symlink that infra/runner-bootstrap.sh atomically
#               re-points at a release dir under /srv/openemr/releases/.
#               The runtime path inside the container (htdocs) is the
#               container's own writable layer, populated from the ro
#               source by the flex entrypoint on each boot. Read-only
#               source means the container can't chown the host tree.
#               Internal network only — Caddy fronts it.
#   - caddy:    Reverse proxy on the public 80/443. Auto-fetches and
#               renews a Let's Encrypt cert for $OE_DOMAIN. Forwards to
#               openemr's internal :443 (which uses a self-signed cert
#               we ignore on the Caddy → openemr hop, since both ends
#               are inside Docker's private network).
#
# This file is the source of truth in the repo. The actual file used
# by docker compose lives at /etc/openemr/docker-compose.yml on the
# Droplet — runner-bootstrap.sh copies it on each deploy. The Caddyfile
# next to it follows the same pattern.
#
# Required env vars (read from /etc/openemr/.env):
#   OE_DOMAIN              The public hostname Caddy serves.
#   APEX_DOMAIN            The apex landing page hostname.
#   OE_USER                Initial OpenEMR admin username.
#   OE_PASS                Initial OpenEMR admin password.
#   MYSQL_ROOT_PASSWORD    MariaDB root password.
#   AGENT_PG_PASSWORD      Password for the agent's Postgres user.
#   ANTHROPIC_API_KEY      Anthropic API key used by the agent's
#                          synthesizer (Claude). Never bake into the
#                          image — only read from /etc/openemr/.env.
#   LANGSMITH_API_KEY      LangSmith API key for §6.1 trace upload.
#                          Same handling as ANTHROPIC_API_KEY: secret,
#                          read from /etc/openemr/.env, never baked.

# Pin the compose project name. Without this, compose derives the name
# from the parent directory of the compose file — so moving the file
# between dirs (e.g. docker/digitalocean/ → /etc/openemr/) would
# silently orphan every named volume by recreating them under a new
# prefix. Pinning here keeps volume names stable across path changes.
name: openemr

services:
  # ---------------------------------------------------------------------------
  # Resource budget (§6.3 — sized for the 4 GB / 2 vCPU production Droplet)
  # ---------------------------------------------------------------------------
  # Per-service caps prevent a runaway from OOM-killing its neighbors. Sum of
  # `mem_limit` is ~3.4 GB out of 4 GB physical, leaving headroom for the OS,
  # the Docker daemon, and short bursts above steady-state. CPU shares are
  # soft caps — services can burst above their `cpus:` quota when neighbors
  # are idle. Bump a single limit ad-hoc with `docker update --memory ...`
  # without editing this file (see docs/RUNBOOK.md).

  mysql:
    image: mariadb:11.8.6@sha256:78a5047d3ba33975f183f183c2464cc7f1eab13ec8667e57cc9a5821d6da7577
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    command: ['mariadbd', '--character-set-server=utf8mb4']
    volumes:
    - databasevolume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh', '--su-mysql', '--connect', '--innodb_initialized']
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    # Light persistence: snapshot to disk if at least 1 key changed in
    # the last 60s. Sessions are the primary use case, so we don't need
    # AOF; an occasional snapshot is enough that a redis crash doesn't
    # log everyone out.
    command: ['redis-server', '--save', '60', '1']
    volumes:
    - redisvolume:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 3s
      retries: 3

  agent-postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${AGENT_PG_PASSWORD}
      POSTGRES_DB: agent
    volumes:
    - agentpgvolume:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent']
      start_period: 30s
      start_interval: 5s
      interval: 30s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: /srv/openemr/current/agent
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    depends_on:
      agent-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '8080'
      DATABASE_URL: postgresql://agent:${AGENT_PG_PASSWORD}@agent-postgres:5432/agent
      # Issuer matches what the PHP proxy mints: site_addr_oath + webroot
      # + /oauth2/{site}. Webroot is empty for the standard install.
      AGENT_JWT_ISSUER: https://${OE_DOMAIN}/oauth2/default
      AGENT_JWT_AUDIENCE: openemr-clinical-copilot-agent
      # Public JWKS — fetched over the internal Docker network. OpenEMR
      # ships /oauth2/{site}/jwk on its HTTP listener; that's port 80
      # inside the container (Caddy fronts 80/443 only on the public
      # interface, so we hit openemr directly).
      OPENEMR_JWKS_URL: http://openemr/oauth2/default/jwk
      # Snapshot fetcher base URL — same internal-network openemr host.
      # Required at agent boot; the service refuses to start without it.
      OPENEMR_BASE_URL: http://openemr
      # Anthropic API key for the synthesizer (Claude). Loaded from
      # /etc/openemr/.env on the Droplet — never bake into the image.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # §6.1 LangSmith tracing. API key loaded from /etc/openemr/.env
      # alongside ANTHROPIC_API_KEY. Tracing is on in prod so per-tool
      # latency, token cost, and verification metadata reach the
      # dashboard for cost projection (Phase 6.2). PHI bodies are
      # suppressed in code via LANGSMITH_HIDE_INPUTS/OUTPUTS=true at
      # server boot — do not override those in this environment.
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_TRACING: 'true'
      LANGSMITH_PROJECT: openemr-clinical-copilot-prod
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8080/health']
      start_period: 30s
      start_interval: 5s
      interval: 30s
      timeout: 5s
      retries: 5

  openemr:
    image: openemr/openemr:flex@sha256:e4562b0c7d3f222ec8f72122ce00d10ffa93f559c38c00ab12c1355394c35d1c
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Source mount: read-only, so the container's chown logic can't
      # touch the host tree. The flex entrypoint populates the
      # container-local /var/www/.../htdocs/openemr from this on boot,
      # so we don't need a corresponding rw bind-mount. /srv/openemr/
      # /current is a symlink runner-bootstrap.sh atomically re-points.
    - /srv/openemr/current:/openemr:ro
      # Application-managed dirs that the upstream image expects to be
      # writable independently of the bind-mount.
    - sitesvolume:/var/www/localhost/htdocs/openemr/sites:rw
    - assetvolume:/var/www/localhost/htdocs/openemr/public/assets:rw
    - themevolume:/var/www/localhost/htdocs/openemr/public/themes:rw
    - nodemodules:/var/www/localhost/htdocs/openemr/node_modules:rw
    - vendordir:/var/www/localhost/htdocs/openemr/vendor:rw
    - logvolume:/var/log
      # The flex image's entrypoint expects /couchdb/data to exist (the
      # full dev-easy stack mounts CouchDB there). We don't run CouchDB,
      # so we mount an empty named volume just to satisfy rsync's
      # link_stat — without this the container exits with code 23.
    - couchdbstub:/couchdb/data
    environment:
      # Read by bootstrap.php via Firehed\Container\AutoDetect to pick
      # between the dynamic Builder (dev) and the cached Compiler (any
      # other value). Required — the CLI entrypoint (./cli, used by the
      # deploy's `migrations:migrate` step) aborts at bootstrap if this
      # is unset. AutoDetect's default envvar list is [ENVIRONMENT, ENV].
      ENVIRONMENT: prod
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: openemr
      MYSQL_PASS: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: openemr
      OE_USER: ${OE_USER}
      OE_PASS: ${OE_PASS}
      # Routes PHP sessions through Redis instead of the in-container
      # /tmp filesystem (which gets wiped on every container recreate).
      # Recognized by the flex entrypoint, which configures the PHP
      # session handler accordingly. host:port form; port defaults to
      # 6379 if omitted.
      REDIS_SERVER: redis
      EASY_DEV_MODE: 'yes'
      EASY_DEV_MODE_NEW: 'yes'
      AGENT_SERVICE_URL: http://agent:8080
    healthcheck:
      test:
      - CMD
      - /usr/bin/curl
      - --fail
      - --insecure
      - --location
      - --silent
      - https://localhost/meta/health/readyz
      start_period: 5m
      start_interval: 15s
      interval: 1m
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    ports:
    - '80:80'
    - '443:443'
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - /opt/site:/srv/site:ro
    - caddydata:/data
    - caddyconfig:/config
    environment:
      OE_DOMAIN: ${OE_DOMAIN}
      APEX_DOMAIN: ${APEX_DOMAIN}
    depends_on:
      openemr:
        condition: service_started

volumes:
  databasevolume: {}
  sitesvolume: {}
  assetvolume: {}
  themevolume: {}
  nodemodules: {}
  vendordir: {}
  logvolume: {}
  redisvolume: {}
  agentpgvolume: {}
  couchdbstub: {}
  caddydata: {}
  caddyconfig: {}
