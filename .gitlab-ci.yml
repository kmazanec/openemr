# GitLab CI: test on MRs and master, deploy master to the DigitalOcean
# Droplet on every push.
#
# Strategy: a project-specific shell-executor runner installed on the
# Droplet runs everything. The runner has Docker but no PHP/Node on the
# host, so test jobs run inside containers via `docker run`. The deploy
# job runs infra/runner-bootstrap.sh natively, which pulls the latest
# master and exec's into infra/deploy.sh from the new commit. The split
# is so that fixes to deploy.sh take effect on the deploy that lands
# them, not the one after — see header in runner-bootstrap.sh.
#
# Runner setup is documented in infra/README.md. Concurrency is pinned
# to 1 in /etc/gitlab-runner/config.toml so test pipelines don't
# contend with a deploy on the 2-vCPU production Droplet.
#
# File-ownership isolation: the test containers run as root (the flex
# image's default), and bind-mounting $CI_PROJECT_DIR alone would have
# the container drop root-owned vendor/, node_modules/, and PHPStan
# cache files into the runner's checkout — which the next pipeline's
# `git clean` (run as gitlab-runner) cannot remove. To avoid that, we
# mount named Docker volumes directly at each path the container
# writes to (vendor/, tmp-phpstan/, agent/node_modules/, plus a
# tmpfs-backed file for .phpunit.result.cache). The container fully
# owns those volumes; the runner's checkout only ever sees empty
# mount-point dirs that gitlab-runner *can* rmdir because it owns the
# parent. Named volumes also persist between pipelines on the same
# Docker daemon, giving us composer/npm cache reuse for free.
#
# Cache busting: when a lockfile changes, the next install step
# refreshes the volume in place. The `cache-prune` job below is a
# manual nuke for the named volumes if they ever get into a weird
# state. If the runner's checkout itself gets poisoned by a
# pre-volume-isolation root-owned file, ssh in and rm -rf the
# offending path under /home/gitlab-runner/builds/.

stages:
- test
- deploy

# Run on MRs and on push to master. Used by all test jobs.
.test-rules: &test-rules
  rules:
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'

.runner-tags: &runner-tags
  tags:
  - openemr-droplet

test:php-isolated:
  <<: [*test-rules, *runner-tags]
  stage: test
  script:
  - |
    docker run --rm \
      -v "$CI_PROJECT_DIR:/work" \
      -v openemr-ci-vendor:/work/vendor \
      --tmpfs /work/.phpunit.result.cache \
      -w /work \
      -e COMPOSER_ALLOW_SUPERUSER=1 \
      -e COMPOSER_HOME=/tmp/composer-home \
      openemr/openemr:flex \
      sh -c '
        # pdo_sqlite is required by the clinical-copilot DBAL isolated tests
        # (in-memory SQLite). The flex image ships pdo_mysql only. Install
        # the matching version against whatever PHP the image happens to
        # ship (currently 8.5; tracks upstream).
        php_ver=$(php --version | head -1 | awk "{print \$2}" | cut -d. -f1-2 | tr -d .) && \
        apk add --no-cache "php${php_ver}-pdo_sqlite" && \
        composer install --no-interaction --no-progress --prefer-dist && \
        composer phpunit-isolated
      '

# Disabled in CI: the 4G memory limit phpstan needs OOM-kills it on
# the 2GB Droplet runner (exit 137). Either move it to a beefier
# runner or relax the level / chunk the analysis before re-enabling.
# Until then, run locally with `composer phpstan` before pushing.
test:phpstan:
  <<: [*runner-tags]
  stage: test
  rules:
  - if: '$CI_COMMIT_BRANCH == "master"'
    when: manual
    allow_failure: true
  script:
  - |
    docker run --rm \
      -v "$CI_PROJECT_DIR:/work" \
      -v openemr-ci-vendor:/work/vendor \
      -v openemr-ci-phpstan-cache:/work/tmp-phpstan \
      -w /work \
      -e COMPOSER_ALLOW_SUPERUSER=1 \
      -e COMPOSER_HOME=/tmp/composer-home \
      openemr/openemr:flex \
      sh -c 'composer install --no-interaction --no-progress --prefer-dist && composer phpstan'

test:agent:
  <<: [*test-rules, *runner-tags]
  stage: test
  script:
  - |
    # Mount the whole repo at /work-root and run from /work-root/agent
    # so the cross-language snapshot contract test can read fixtures at
    # ../../../tests/Tests/Isolated/Modules/ClinicalCopilot/Snapshot/
    # fixtures/snapshot/. node_modules is overlaid with a named volume
    # so npm install never lands on the host bind mount.
    docker run --rm \
      -v "$CI_PROJECT_DIR:/work-root" \
      -v openemr-ci-node-modules:/work-root/agent/node_modules \
      -w /work-root/agent \
      node:22-alpine \
      sh -c 'npm ci --no-audit --no-fund && npm run lint && npm run typecheck && npm test'

deploy:
  <<: *runner-tags
  stage: deploy
  rules:
  - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
  script:
  - bash /srv/openemr/current/infra/runner-bootstrap.sh
  environment:
    name: production
    url: https://emr.biograph.dev

# Manual nuke for the named CI volumes. Run from the GitLab UI
# (CI/CD → Pipelines → "Run pipeline" on master, then click "Play" on
# this job) if a lockfile-vs-installed mismatch leaves a volume in a
# weird state. The next test pipeline reinstalls from scratch.
cache-prune:
  <<: *runner-tags
  stage: test
  rules:
  - if: '$CI_COMMIT_BRANCH == "master"'
    when: manual
    allow_failure: true
  script:
  - docker volume rm -f openemr-ci-vendor openemr-ci-phpstan-cache openemr-ci-node-modules
  - docker volume ls --filter name=openemr-ci-
