# GitLab CI: test on MRs and master, deploy master to the DigitalOcean
# Droplet on every push.
#
# Strategy: a project-specific shell-executor runner installed on the
# Droplet runs everything. The runner has Docker but no PHP/Node on the
# host, so test jobs run inside containers via `docker run`. The deploy
# job runs infra/runner-bootstrap.sh natively, which pulls the latest
# master and exec's into infra/deploy.sh from the new commit. The split
# is so that fixes to deploy.sh take effect on the deploy that lands
# them, not the one after — see header in runner-bootstrap.sh.
#
# Runner setup is documented in infra/README.md. Concurrency is pinned
# to 1 in /etc/gitlab-runner/config.toml so test pipelines don't
# contend with a deploy on the 2-vCPU production Droplet.
#
# File-ownership isolation: the test containers run as root (the flex
# image's default), and bind-mounting $CI_PROJECT_DIR alone would have
# the container drop root-owned vendor/, node_modules/, and PHPStan
# cache files into the runner's checkout — which the next pipeline's
# `git clean` (run as gitlab-runner) cannot remove. To avoid that, we
# mount named Docker volumes directly at each path the container
# writes to (vendor/, tmp-phpstan/, agent/node_modules/, plus a
# tmpfs-backed file for .phpunit.result.cache). The container fully
# owns those volumes; the runner's checkout only ever sees empty
# mount-point dirs that gitlab-runner *can* rmdir because it owns the
# parent. Named volumes also persist between pipelines on the same
# Docker daemon, giving us composer/npm cache reuse for free.
#
# Cache busting: when a lockfile changes, the next install step
# refreshes the volume in place. The `cache-prune` job below is a
# manual nuke for the named volumes if they ever get into a weird
# state. If the runner's checkout itself gets poisoned by a
# pre-volume-isolation root-owned file, ssh in and rm -rf the
# offending path under /home/gitlab-runner/builds/.

stages:
- test
- deploy

# Run on MRs and on push to master. Used by all test jobs.
.test-rules: &test-rules
  rules:
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'

.runner-tags: &runner-tags
  tags:
  - openemr-droplet

test:php-isolated:
  <<: [*test-rules, *runner-tags]
  stage: test
  script:
  - |
    docker run --rm \
      -v "$CI_PROJECT_DIR:/work" \
      -v openemr-ci-vendor:/work/vendor \
      --tmpfs /work/.phpunit.result.cache \
      -w /work \
      -e COMPOSER_ALLOW_SUPERUSER=1 \
      -e COMPOSER_HOME=/tmp/composer-home \
      openemr/openemr:flex \
      sh -c '
        # Runtime apk additions:
        #   php-${php_ver}-pdo_sqlite: clinical-copilot DBAL isolated
        #     tests use in-memory SQLite. The flex image ships
        #     pdo_mysql only. Install the matching extension against
        #     whatever PHP the image happens to ship (currently 8.5;
        #     tracks upstream).
        #   imagemagick-tiff: Alpine subpackage that registers
        #     ImageMagick s libtiff delegate. Without it, ext-imagick
        #     loads, but Imagick::queryFormats(TIFF) returns [] and
        #     readImageBlob on TIFF bytes throws "no decode delegate".
        #     Alpine splits ImageMagick s format support across
        #     subpackages; installing libtiff (apk add tiff) alone
        #     does not help because the ImageMagick package is
        #     compiled without TIFF support. Production also adds
        #     imagemagick-tiff via docker/digitalocean/openemr/Dockerfile.
        php_ver=$(php --version | head -1 | awk "{print \$2}" | cut -d. -f1-2 | tr -d .) && \
        apk add --no-cache \
          "php${php_ver}-pdo_sqlite" \
          imagemagick-tiff && \
        composer install --no-interaction --no-progress --prefer-dist && \
        composer phpunit-isolated
      '

# Disabled in CI: the 4G memory limit phpstan needs OOM-kills it on
# the 2GB Droplet runner (exit 137). Either move it to a beefier
# runner or relax the level / chunk the analysis before re-enabling.
# Until then, run locally with `composer phpstan` before pushing.
test:phpstan:
  <<: [*runner-tags]
  stage: test
  rules:
  - if: '$CI_COMMIT_BRANCH == "master"'
    when: manual
    allow_failure: true
  script:
  - |
    docker run --rm \
      -v "$CI_PROJECT_DIR:/work" \
      -v openemr-ci-vendor:/work/vendor \
      -v openemr-ci-phpstan-cache:/work/tmp-phpstan \
      -w /work \
      -e COMPOSER_ALLOW_SUPERUSER=1 \
      -e COMPOSER_HOME=/tmp/composer-home \
      openemr/openemr:flex \
      sh -c 'composer install --no-interaction --no-progress --prefer-dist && composer phpstan'

test:agent:
  <<: [*test-rules, *runner-tags]
  stage: test
  script:
  - |
    # Mount the whole repo at /work-root and run from /work-root/agent
    # so the cross-language snapshot contract test can read fixtures at
    # ../../../tests/Tests/Isolated/Modules/ClinicalCopilot/Snapshot/
    # fixtures/snapshot/. node_modules is overlaid with a named volume
    # so npm install never lands on the host bind mount.
    #
    # Vitest discovers `evals/**/*.test.ts` automatically — the §3.6
    # UC1 golden cases run inside this same job on every MR. The
    # adjacent `test:agent-evals-nightly` job runs the LangSmith
    # experiment that exercises the real synthesizer; that one is
    # gated to schedules to keep per-MR cost predictable.
    # System deps for `canvas` (transitive of `pdf-img-convert`, the §B.3
    # rasterizer): no prebuilt linux-musl-x64 binary is published for
    # node-v127 (Node 22 on Alpine), so npm falls back to a source build
    # and needs Cairo/Pango/JPEG/GIF/Pixman dev headers plus python3,
    # make, g++ at install time. The PDF → image rendering path runs in
    # production and (gated on RUN_RASTERIZER_RENDER_TESTS=1) in CI, so
    # the deps are mandatory rather than optional.
    docker run --rm \
      -v "$CI_PROJECT_DIR:/work-root" \
      -v openemr-ci-node-modules:/work-root/agent/node_modules \
      -w /work-root/agent \
      node:22-alpine \
      sh -c '
        apk add --no-cache \
          build-base g++ make python3 pkgconf \
          cairo-dev pango-dev jpeg-dev giflib-dev libjpeg-turbo-dev pixman-dev && \
        npm ci --no-audit --no-fund && \
        npm run lint && \
        npm run typecheck && \
        npm test
      '

test:dashboard:
  <<: [*test-rules, *runner-tags]
  stage: test
  script:
  - |
    # Same shape as test:agent: node:22-alpine in a Docker container,
    # node_modules on a named volume so npm install never lands on
    # the host bind mount. The dashboard has no native modules, so
    # the apk surface stays empty.
    #
    # `vite build` writes to dashboard/dist/. We mount THAT path on a
    # named volume too — without it, the container (running as root)
    # would drop root-owned files on the gitlab-runner-owned bind
    # mount, and the next pipeline's `git checkout` would fail trying
    # to clean them up. Discarding dist/ at job-exit is fine: the
    # bundle isn't pushed to production via this artifact (infra/
    # deploy.sh rebuilds against the deploy SHA's source). The build
    # is only run here as a smoke test that the source compiles.
    docker run --rm \
      -v "$CI_PROJECT_DIR:/work-root" \
      -v openemr-ci-dashboard-node-modules:/work-root/dashboard/node_modules \
      -v openemr-ci-dashboard-dist:/work-root/dashboard/dist \
      -w /work-root/dashboard \
      node:22-alpine \
      sh -c '
        npm ci --no-audit --no-fund && \
        npm run lint && \
        npm run typecheck && \
        npm test && \
        npm run build
      '

# §3.6 nightly LangSmith experiment. Bootstraps the
# `clinical-copilot-uc1-golden-v1` dataset (idempotent) and runs the
# briefing graph against every example, posting results as a
# LangSmith experiment tagged with $CI_COMMIT_SHA. Schedule this from
# CI/CD → Schedules. Master gets a manual button as an escape hatch.
#
# Required CI variables (Settings → CI/CD → Variables, masked):
#   - LANGSMITH_API_KEY
#   - ANTHROPIC_API_KEY
# When either is unset the runner scripts return a structured
# `skippedReason` and exit 0 — so a misconfigured schedule doesn't
# silently look healthy. CI logs show the JSON result either way.
test:agent-evals-nightly:
  <<: *runner-tags
  stage: test
  rules:
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$CI_COMMIT_BRANCH == "master"'
    when: manual
    allow_failure: true
  script:
  - |
    docker run --rm \
      -v "$CI_PROJECT_DIR:/work-root" \
      -v openemr-ci-node-modules:/work-root/agent/node_modules \
      -w /work-root/agent \
      -e LANGSMITH_API_KEY \
      -e ANTHROPIC_API_KEY \
      -e LANGSMITH_PROJECT \
      -e CI_COMMIT_SHA \
      node:22-alpine \
      sh -c '
        apk add --no-cache \
          build-base g++ make python3 pkgconf \
          cairo-dev pango-dev jpeg-dev giflib-dev libjpeg-turbo-dev pixman-dev && \
        npm ci --no-audit --no-fund && \
        npm run evals:upload-dataset && \
        npm run evals:experiment
      '

deploy:
  <<: *runner-tags
  stage: deploy
  rules:
  - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
  script:
  - bash /srv/openemr/current/infra/runner-bootstrap.sh
  environment:
    name: production
    url: https://emr.biograph.dev

# Manual nuke for the named CI volumes. Run from the GitLab UI
# (CI/CD → Pipelines → "Run pipeline" on master, then click "Play" on
# this job) if a lockfile-vs-installed mismatch leaves a volume in a
# weird state. The next test pipeline reinstalls from scratch.
cache-prune:
  <<: *runner-tags
  stage: test
  rules:
  - if: '$CI_COMMIT_BRANCH == "master"'
    when: manual
    allow_failure: true
  script:
  - docker volume rm -f openemr-ci-vendor openemr-ci-phpstan-cache openemr-ci-node-modules openemr-ci-dashboard-node-modules openemr-ci-dashboard-dist
  - docker volume ls --filter name=openemr-ci-

# Manual button on master to bootstrap the LangSmith golden dataset
# without burning a synthesizer experiment. Idempotent — if the
# dataset already exists, the job is a no-op.
evals:bootstrap-dataset:
  <<: *runner-tags
  stage: test
  rules:
  - if: '$CI_COMMIT_BRANCH == "master"'
    when: manual
    allow_failure: true
  script:
  - |
    docker run --rm \
      -v "$CI_PROJECT_DIR:/work-root" \
      -v openemr-ci-node-modules:/work-root/agent/node_modules \
      -w /work-root/agent \
      -e LANGSMITH_API_KEY \
      -e LANGSMITH_PROJECT \
      node:22-alpine \
      sh -c 'npm ci --no-audit --no-fund && npm run evals:upload-dataset'
