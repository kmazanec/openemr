# GitLab CI: deploy master to the DigitalOcean Droplet on every push.
#
# Strategy: a project-specific shell-executor runner installed on the
# Droplet itself runs infra/deploy.sh directly. No SSH, no secrets — the
# runner is already on the target host. The deploy script does an
# in-place rolling recreate of the openemr container; MariaDB and Caddy
# stay up across the deploy.
#
# Runner setup is documented in infra/README.md.

stages:
- deploy

deploy:
  stage: deploy
  tags:
  - openemr-droplet
  rules:
  - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
  script:
  - bash /opt/openemr/infra/deploy.sh
  environment:
    name: production
    url: https://emr.biograph.dev
